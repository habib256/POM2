# POM2 continuous integration.
#
# Two jobs:
#   linux  — build the full tree (GUI + pom2_headless + unit tests) and run the
#            ~130-test ctest suite (Klaus 6502/65C02, Tom Harte curated,
#            cpu_cycle_count, golden-hash display, boot traces). This is the
#            non-regression gate: it must stay green on every push / PR.
#   wasm   — Emscripten verification build (build_wasm.sh) so the browser
#            target can never silently rot. Build-only; no test run in-browser.
#
# No test depends on machine ROM dumps — the suite drives the emulator core
# directly. Dear ImGui is gitignored; both jobs clone it shallowly (same as
# ./setup_imgui.sh).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']   # both tag forms accepted by release.yml
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:17 UTC daily — the sanitizer job below. Off the hour on purpose:
    # GitHub queues cron runs and the top of the hour is the busiest slot.
    - cron: '17 3 * * *'

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap, and first: TODO.md's standing rule is "do not grow the
      # god-objects" (target < 3000 lines). It had no mechanism, and
      # MainWindow.cpp went 5590 -> 11511 lines with the rule in force. This
      # is the mechanism — growing a file over its recorded ceiling now needs
      # tools/file_size_budget.txt edited in the same commit, which is exactly
      # when someone should be asked whether the code belongs in a new TU.
      - name: File-size ratchet
        run: tools/check_file_sizes.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config libglfw3-dev libgl1-mesa-dev

      # Dear ImGui is gitignored (setup_imgui.sh normally clones it). POM2 needs
      # the `docking` branch at a PINNED commit — docking is absent from master
      # and the branch is force-pushed on every upstream rebase, so an unpinned
      # clone makes CI fail on changes we never made. Pin lives in
      # imgui_pin.env, shared with setup_imgui.sh.
      - name: Fetch Dear ImGui (pinned)
        run: |
          set -euo pipefail
          source ./imgui_pin.env
          git init -q imgui
          git -C imgui remote add origin "$IMGUI_REPO"
          git -C imgui fetch --depth 1 origin "$IMGUI_COMMIT"
          git -C imgui checkout -q FETCH_HEAD
          test "$(git -C imgui rev-parse HEAD)" = "$IMGUI_COMMIT"

      - name: Configure (Release, tests on)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOM2_ENABLE_TESTS=ON

      - name: Build everything
        run: cmake --build build --parallel 2

      # --parallel $(nproc), not the historical 2. The suite used to be green
      # only BECAUSE it ran two-wide: 132 of 189 declared TIMEOUTs were 5 or
      # 10 s, and at --parallel 8 on a 16-core box two tests blew budgets they
      # clear in under 1.3 s alone. That is fixed at the source now (a 30 s
      # floor plus RUN_SERIAL on the wall-clock tests, tests/CMakeLists.txt),
      # so the runner's real width is safe to use — and using it is what keeps
      # the fix honest, since a two-wide run would hide a regression of it.
      - name: Run ctest
        working-directory: build
        run: ctest --output-on-failure --parallel $(nproc)

      # The binary this job just built and tested, kept so a run can be
      # checked out rather than only read about. Not a release package (no
      # roms/, no fonts/ — packaging/bundle.manifest and release.yml own that);
      # this is the CI build itself, for bisecting a regression or handing
      # someone the exact binary a run produced.
      - name: Upload the Linux build
        uses: actions/upload-artifact@v5
        with:
          name: POM2-linux-x86_64-ci
          path: build/POM2
          if-no-files-found: error
          retention-days: 14

      # The GLES 3.0 tier (POM2_GLES=ON) is what the Raspberry Pi release
      # package is built with. It shares every source file with the desktop
      # build and differs only in the headers, the shader prologue and the
      # context request — which is exactly the kind of second configuration
      # that rots silently. Build-only: the test suite is renderer-agnostic and
      # already ran above.
      - name: Install the GLES toolchain
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgles2-mesa-dev libegl1-mesa-dev

      - name: Verify the GLES tier still builds (Raspberry Pi target)
        run: |
          set -euo pipefail
          cmake -S . -B build-gles \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOM2_ENABLE_TESTS=OFF \
            -DPOM2_GLES=ON
          cmake --build build-gles --parallel 2
          # Assert the tier is really engaged: GLESv2 linked, desktop libGL not.
          # Without this the job would happily pass on a build that silently
          # fell back to desktop GL, which is the failure it exists to catch.
          ldd build-gles/POM2 | grep -qE 'libGLESv2' \
            || { echo "ERROR: GLES build does not link libGLESv2"; exit 1; }
          if ldd build-gles/POM2 | grep -qE 'lib(GL|OpenGL)\.so'; then
            echo "ERROR: GLES build links desktop libGL"; exit 1
          fi
          echo "OK: GLES tier builds and links GLESv2 only"

  # ── The two platforms that used to compile only at tag time ──────────────
  # POM2 ships macOS .app and Windows .zip packages, and carries 62 `_WIN32`
  # directives (SocketCompat.h alone has 29) plus a macOS-only path or two.
  # None of it was compiled between releases: the windows/macos jobs live in
  # release.yml, which triggers on tag push. So a break on either platform was
  # discovered DURING a release, with the version already tagged — the worst
  # possible moment and the hardest to back out of.
  #
  # These two are build-only on purpose. Packaging, signing, universal-binary
  # lipo and the payload verification are release concerns and stay there; all
  # this has to answer is "does the tree still compile for that toolchain",
  # which is the question whose answer used to arrive too late.

  macos:
    name: macOS build (no packaging, no tests)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Dear ImGui (pinned)
        run: tools/fetch_imgui_pinned.sh

      # Homebrew's glfw, not the universal static build release.yml makes:
      # this job is a compile check, and a universal build would spend most of
      # its runtime on a slice nothing here inspects.
      - name: Install build dependencies
        run: brew install glfw

      - name: Configure + build
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOM2_ENABLE_TESTS=ON
          cmake --build build --parallel 3
          # Tests are BUILT (they are first-party code and their portability
          # matters) even though they are not RUN — see the note below.

      # NOT ctest — build only, deliberately, and this is the story.
      #
      # The first run of this job with `ctest` enabled came back 191/192: one
      # failure, `disk_path_snapshot`, killed by SIGBUS on arm64 macOS. The
      # same test is green on Linux, green under ASan+UBSan with leak
      # detection, and green at every parallelism tried — so it is a real
      # platform-specific finding, and finding it is exactly what a second
      # platform is for.
      #
      # It is also not something to hold this job hostage to. The job's job is
      # "does the tree still compile for that toolchain", which is the question
      # whose answer used to arrive at tag time; a permanently red CI answers
      # nothing and trains people to stop looking. And the alternative — an
      # exclusion for the one failing test — is the papering-over this project
      # refuses on principle (see w5100_udp_recv in TODO.md).
      #
      # So: the compile check ships and stays green, and the finding is filed
      # in TODO.md with its signature. Re-enable this step in the same commit
      # that fixes it.

  windows:
    name: Windows build (no packaging)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Dear ImGui (pinned)
        shell: bash
        run: tools/fetch_imgui_pinned.sh

      # Same triplet as release.yml: x64-windows-static carries
      # VCPKG_CRT_LINKAGE=static and so matches POM2's own static CRT. Using a
      # different triplet here would compile a configuration the release never
      # builds, which defeats the point of the job.
      - name: Install GLFW via vcpkg (manifest mode, static triplet)
        run: vcpkg install --triplet x64-windows-static

      # Tests OFF, matching release.yml: the suite has never been built for
      # MSVC and turning it on here would report a backlog of test-code
      # portability work as a CI failure on unrelated commits. The application
      # is what ships on Windows and the application is what this proves.
      - name: Configure + build
        shell: cmd
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DPOM2_ENABLE_TESTS=OFF
          cmake --build build --config Release --parallel 3

  # ── Nightly sanitizers ───────────────────────────────────────────────────
  # POM2_SANITIZE has been a CMake option for a while and CI never once used
  # it, so the "controller TSan clean" result recorded in TODO.md had nothing
  # keeping it true. Baseline established 2026-08-22 before this job was
  # added: 191/191 green under ASan+UBSan with detect_leaks=1, so a red here
  # is a regression and not a backlog. ASan+UBSan runs the whole suite; TSan runs the subset that
  # actually exercises the threading contract, because TSan and ASan cannot be
  # combined and a full TSan pass over pure-computation tests buys nothing.
  #
  # Nightly rather than per-push: the instrumented suite is several times
  # slower, and a race that appears today was almost never introduced in the
  # last commit anyway.
  #
  # Both variants were run locally before this job was added, because shipping
  # a CI job nobody has executed is how a pipeline becomes decorative: ASan +
  # UBSan is 191/191 green with detect_leaks=1, and the TSan subset is 8/8
  # green across three consecutive runs. The two things that stood between
  # those numbers and a red first night — the ASLR wrapper and the libpulse
  # suppression — are below and in tests/tsan.supp.
  sanitizers:
    name: Nightly ASan/UBSan + TSan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: address,undefined
            name: asan-ubsan
            # Empty filter = the whole suite, and therefore the whole tree has
            # to be built.
            filter: ''
            targets: ''
          - san: thread
            name: tsan
            # The threading contract: the CPU worker's park/resume protocol,
            # the rewind transport across it, the audio source teardown, the
            # HTTP server's handler thread, the SP link worker and the print
            # spooler. These are the tests that have more than one thread.
            #
            # `targets` lists their executables so this leg builds EIGHT
            # binaries instead of two hundred. The first run of this job spent
            # 50 of its 51 minutes compiling test binaries it then never ran.
            filter: '(rewind_transport|audio_source_teardown|ai_control_server_smoke|sp_over_slip_link|printer_history|thread_guard|fujinet_net_device|child_process)'
            targets: '--target test_rewind_transport test_audio_source_teardown test_ai_control_server test_sp_over_slip_link test_printer_history test_thread_guard test_fujinet_net_device test_child_process'
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config libglfw3-dev libgl1-mesa-dev ccache

      - name: Fetch Dear ImGui (pinned)
        run: |
          set -euo pipefail
          source ./imgui_pin.env
          git init -q imgui
          git -C imgui remote add origin "$IMGUI_REPO"
          git -C imgui fetch --depth 1 origin "$IMGUI_COMMIT"
          git -C imgui checkout -q FETCH_HEAD
          test "$(git -C imgui rev-parse HEAD)" = "$IMGUI_COMMIT"

      # Measured, and the reason this step exists: the ASan leg compiles the
      # WHOLE test tree instrumented, and on a four-core runner that took about
      # two hours before it ever reached ctest — a nightly that spends its night
      # compiling reports nothing. Nearly all of it is unchanged translation
      # units from the night before, which is exactly what ccache is for. The
      # key carries the sanitizer flavour so the two legs never share objects
      # compiled with different instrumentation.
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-san-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-san-${{ matrix.name }}-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      # RelWithDebInfo, not Release: sanitizer reports without line numbers
      # cost more time to act on than the run costs to produce.
      #
      # POM2_TEST_TIMEOUT_SCALE=6 from measurement, not a guess: the full
      # suite takes 71 s uninstrumented and 417 s under ASan+UBSan on the same
      # host — x5.9. The suite's timeouts are sized for an uninstrumented
      # build, so without the scale this job reports timeouts (which read as
      # hangs) instead of the memory and race findings it exists for.
      - name: Configure (${{ matrix.name }})
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPOM2_ENABLE_TESTS=ON \
            -DPOM2_SANITIZE=${{ matrix.san }} \
            -DPOM2_TEST_TIMEOUT_SCALE=6 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # --parallel 4, not 2: the runner has four cores, and at two the
      # instrumented build of the whole test tree ran past 100 minutes without
      # ever reaching ctest. The other jobs' `--parallel 2` is a convention
      # this one cannot afford.
      - name: Build
        run: cmake --build build-san --parallel 4 ${{ matrix.targets }}

      # Printed so a night that got slow again is diagnosable from the log:
      # a hit rate near zero means the cache key stopped matching, not that
      # the tree suddenly grew.
      - name: ccache statistics
        run: ccache --show-stats

      # `setarch -R` disables ASLR for the whole ctest tree, and TSan needs it:
      # on kernels >= 6.6 the default vm.mmap_rnd_bits=32 puts mappings outside
      # the address ranges TSan's shadow memory assumes, and every binary dies
      # instantly with "FATAL: ThreadSanitizer: unexpected memory mapping"
      # before running a line. Verified on 6.14: 6 of 8 tests died that way
      # without it, all 8 pass with it. The personality is inherited by ctest's
      # children, so wrapping ctest is enough. ASan and UBSan do not care, and
      # a fixed layout costs them nothing, so the wrapper is unconditional.
      - name: Run ctest under ${{ matrix.name }}
        working-directory: build-san
        env:
          # halt_on_error keeps the first report as the failure, instead of a
          # log where the real one scrolled past a hundred later ones.
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          # The suppressions file holds third-party libraries only, and each
          # entry is there because a report named it — see tests/tsan.supp.
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/tests/tsan.supp
          # Passed through the environment, not interpolated into the command
          # line: `-R (a|b)` unquoted is a bash syntax error, which is exactly
          # how the first run of this job died after a 50-minute build.
          POM2_TEST_FILTER: ${{ matrix.filter }}
        run: |
          set -euo pipefail
          if [ -n "$POM2_TEST_FILTER" ]; then
            setarch -R ctest --output-on-failure --parallel 4 -R "$POM2_TEST_FILTER"
          else
            setarch -R ctest --output-on-failure --parallel 4
          fi

  wasm:
    name: WASM verification build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Dear ImGui (pinned)
        run: |
          set -euo pipefail
          source ./imgui_pin.env
          git init -q imgui
          git -C imgui remote add origin "$IMGUI_REPO"
          git -C imgui fetch --depth 1 origin "$IMGUI_COMMIT"
          git -C imgui checkout -q FETCH_HEAD
          test "$(git -C imgui rev-parse HEAD)" = "$IMGUI_COMMIT"

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build WASM target
        run: ./build_wasm.sh

      - name: Verify artifacts were produced
        run: |
          for f in wasm/index.html wasm/POM2.js wasm/POM2.wasm; do
            test -s "$f" || { echo "missing/empty artifact: $f" >&2; exit 1; }
          done
          echo "WASM artifacts OK:"
          ls -lh wasm/POM2.wasm wasm/POM2.js wasm/index.html

      # The online demo IS the committed wasm/ folder — GitHub Pages serves it
      # straight from the branch — so it is published content, not a build
      # artifact that can lag harmlessly. This job rebuilds the bundle to prove
      # the sources still compile for the browser, but it does NOT deploy; a
      # forgotten rebuild would leave a stale demo online with nothing failing.
      # Compares SOURCE fingerprints rather than bytes: emcc output is not
      # reproducible across emsdk versions, so a byte diff would fail forever.
      #
      # Uploaded BEFORE the staleness check below, deliberately: that check's
      # own remedy is "take the freshly built bundle out of the run", which was
      # impossible while nothing was published — the instruction pointed at
      # files no one could reach. Ordering it first means the bundle is there
      # precisely on the run where the check fails.
      - name: Upload the WASM bundle
        uses: actions/upload-artifact@v5
        with:
          name: POM2-wasm-bundle
          path: |
            wasm/index.html
            wasm/POM2.js
            wasm/POM2.wasm
            wasm/POM2.data
          if-no-files-found: error
          retention-days: 14

      # If this trips: the build above already produced a fresh bundle, so take
      # the POM2-wasm-bundle artifact from this run (or rebuild locally), then
      # `tools/wasm_stamp.sh --write` and commit wasm/.
      - name: Is the committed wasm/ bundle up to date?
        run: tools/wasm_stamp.sh --check
