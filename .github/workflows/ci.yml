# POM2 continuous integration.
#
# Four jobs:
#   linux  — build the full tree (GUI + pom2_headless + unit tests) and run the
#            ~130-test ctest suite (Klaus 6502/65C02, Tom Harte curated,
#            cpu_cycle_count, golden-hash display, boot traces). This is the
#            non-regression gate: it must stay green on every push / PR.
#   wasm   — Emscripten verification build (build_wasm.sh) so the browser
#            target can never silently rot. Build-only; no test run in-browser.
#   portable-core — native macOS + Windows builds of pom2_core/headless and a
#            deterministic renderer-free test contract on every PR/push.
#   frontend-tsan — instrument the complete Linux frontend and run the worker /
#            UI / AI / audio / rewind concurrency contracts under ThreadSanitizer.
#
# No test depends on machine ROM dumps — the suite drives the emulator core
# directly. Dear ImGui is gitignored; both jobs clone it shallowly (same as
# ./setup_imgui.sh).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']   # both tag forms accepted by release.yml
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: ${{ matrix.name }} core + headless contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure core/headless only
        run: >-
          cmake -S . -B build-portable
          -DCMAKE_BUILD_TYPE=Release
          -DPOM2_BUILD_FRONTEND=OFF
          -DPOM2_ENABLE_TESTS=ON
          -DPOM2_INSTALL_CORE_SDK=ON
          -DPOM2_ENABLE_SLIRP=OFF
          -DPOM2_WIN_STATIC_RUNTIME=OFF

      - name: Build core and portable test executables
        run: >-
          cmake --build build-portable --config Release --parallel 2 --target
          pom2_core pom2_headless
          test_pom2_core_api test_system_profile test_paste
          test_input_c0xx_contract test_language_card test_iie_aux_paging
          test_cpu_cycle_count test_slot_config test_kbd_strobe_mirror
          test_slot_configuration_coordinator
          test_slot_card_factory
          test_slot_rebuild_coordinator
          test_deterministic_adapter_injection

      - name: Run deterministic headless contract
        run: >-
          ctest --test-dir build-portable --build-config Release
          --output-on-failure --parallel 2 -L portable-headless

  linux:
    name: Linux build + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config libglfw3-dev libgl1-mesa-dev

      # Dear ImGui is gitignored (setup_imgui.sh normally clones it). POM2 needs
      # the `docking` branch at a PINNED commit — docking is absent from master
      # and the branch is force-pushed on every upstream rebase, so an unpinned
      # clone makes CI fail on changes we never made. Pin lives in
      # imgui_pin.env, shared with setup_imgui.sh.
      - name: Fetch Dear ImGui (pinned)
        run: |
          set -euo pipefail
          source ./imgui_pin.env
          git init -q imgui
          git -C imgui remote add origin "$IMGUI_REPO"
          git -C imgui fetch --depth 1 origin "$IMGUI_COMMIT"
          git -C imgui checkout -q FETCH_HEAD
          test "$(git -C imgui rev-parse HEAD)" = "$IMGUI_COMMIT"

      - name: Configure (Release, tests on)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOM2_ENABLE_TESTS=ON

      - name: Build everything
        run: cmake --build build --parallel 2

      - name: Run ctest
        working-directory: build
        run: ctest --output-on-failure --parallel 2

      # The GLES 3.0 tier (POM2_GLES=ON) is what the Raspberry Pi release
      # package is built with. It shares every source file with the desktop
      # build and differs only in the headers, the shader prologue and the
      # context request — which is exactly the kind of second configuration
      # that rots silently. Build-only: the test suite is renderer-agnostic and
      # already ran above.
      - name: Install the GLES toolchain
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgles2-mesa-dev libegl1-mesa-dev

      - name: Verify the GLES tier still builds (Raspberry Pi target)
        run: |
          set -euo pipefail
          cmake -S . -B build-gles \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOM2_ENABLE_TESTS=OFF \
            -DPOM2_GLES=ON
          cmake --build build-gles --parallel 2
          # Assert the tier is really engaged: GLESv2 linked, desktop libGL not.
          # Without this the job would happily pass on a build that silently
          # fell back to desktop GL, which is the failure it exists to catch.
          ldd build-gles/POM2 | grep -qE 'libGLESv2' \
            || { echo "ERROR: GLES build does not link libGLESv2"; exit 1; }
          if ldd build-gles/POM2 | grep -qE 'lib(GL|OpenGL)\.so'; then
            echo "ERROR: GLES build links desktop libGL"; exit 1
          fi
          echo "OK: GLES tier builds and links GLESv2 only"

  frontend-tsan:
    name: Linux frontend ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config libglfw3-dev libgl1-mesa-dev

      - name: Fetch Dear ImGui (pinned)
        run: |
          set -euo pipefail
          source ./imgui_pin.env
          git init -q imgui
          git -C imgui remote add origin "$IMGUI_REPO"
          git -C imgui fetch --depth 1 origin "$IMGUI_COMMIT"
          git -C imgui checkout -q FETCH_HEAD
          test "$(git -C imgui rev-parse HEAD)" = "$IMGUI_COMMIT"

      - name: Configure frontend with ThreadSanitizer
        run: >-
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPOM2_ENABLE_TESTS=ON
          -DPOM2_BUILD_FRONTEND=ON
          -DPOM2_ENABLE_SLIRP=OFF
          -DPOM2_SANITIZE=thread

      - name: Build instrumented frontend and concurrency contracts
        run: >-
          cmake --build build-tsan --parallel 2 --target
          pom2_imgui
          test_frontend_device_panel_concurrency
          test_printer_coordinator
          test_storage_coordinator
          test_audio_coordinator
          test_mouse_coordinator
          test_memory_viewer_write_lock
          test_audio_source_teardown
          test_disk_path_snapshot
          test_rewind_transport

      - name: Run frontend concurrency campaign
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 history_size=7
        run: >-
          ctest --test-dir build-tsan --output-on-failure
          --timeout 180 -L frontend-tsan

  wasm:
    name: WASM verification build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Dear ImGui (pinned)
        run: |
          set -euo pipefail
          source ./imgui_pin.env
          git init -q imgui
          git -C imgui remote add origin "$IMGUI_REPO"
          git -C imgui fetch --depth 1 origin "$IMGUI_COMMIT"
          git -C imgui checkout -q FETCH_HEAD
          test "$(git -C imgui rev-parse HEAD)" = "$IMGUI_COMMIT"

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build WASM target
        run: ./build_wasm.sh

      - name: Verify artifacts were produced
        run: |
          for f in wasm/index.html wasm/POM2.js wasm/POM2.wasm; do
            test -s "$f" || { echo "missing/empty artifact: $f" >&2; exit 1; }
          done
          echo "WASM artifacts OK:"
          ls -lh wasm/POM2.wasm wasm/POM2.js wasm/index.html

      # The online demo IS the committed wasm/ folder — GitHub Pages serves it
      # straight from the branch — so it is published content, not a build
      # artifact that can lag harmlessly. This job rebuilds the bundle to prove
      # the sources still compile for the browser, but it does NOT deploy; a
      # forgotten rebuild would leave a stale demo online with nothing failing.
      # Compares SOURCE fingerprints rather than bytes: emcc output is not
      # reproducible across emsdk versions, so a byte diff would fail forever.
      #
      # If this trips: the build above already produced a fresh bundle, so copy
      # wasm/{index.html,POM2.js,POM2.wasm,POM2.data} out of the run (or rebuild
      # locally), then `tools/wasm_stamp.sh --write` and commit wasm/.
      - name: Is the committed wasm/ bundle up to date?
        run: tools/wasm_stamp.sh --check
