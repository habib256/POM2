# Build + push the FROZEN POM2 Linux release toolchain image to GHCR.
#
# Run this MANUALLY, and only when packaging/linux/Dockerfile.bionic changes.
# It is deliberately off the release critical path: every flaky step (bionic's
# EOL apt mirrors, source builds, tool downloads) happens here, once, where a
# failure costs a retry rather than a broken release.
#
# After a successful run, copy the digest it prints into the `BUILDER_IMAGE`
# env of the `linux` job in release.yml so releases are pinned by digest and
# fully reproducible. The moving `:bionic` tag is published too, for convenience
# when experimenting — but never for a release.
name: Build bionic builder image

on:
  workflow_dispatch:
  push:
    paths:
      - 'packaging/linux/Dockerfile.bionic'
      - '.github/workflows/build-bionic-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the image
        run: |
          set -euo pipefail
          # GHCR repository names must be lowercase; the GitHub owner may not be.
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/pom2-bionic-builder"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f packaging/linux/Dockerfile.bionic -t "$IMAGE:bionic" .

      - name: Smoke-test the toolchain inside the image
        run: |
          set -euo pipefail
          # Prove the image can actually do its job before publishing it: the
          # compiler must be g++-9 (bionic's default 7 has no usable
          # <filesystem>), CMake must be >= 3.16, GLFW 3.3 must be findable, and
          # the AppImage tools must be present and extracted.
          docker run --rm "$IMAGE:bionic" bash -euxo pipefail -c '
            g++ --version | head -1
            g++ -dumpversion | grep -q "^9" || { echo "ERROR: g++ is not 9.x"; exit 1; }
            cmake --version | head -1
            test -f /usr/local/lib/libglfw.so.3 || { echo "ERROR: GLFW 3.3 missing"; exit 1; }
            test -x "$POM2_APPIMAGE_TOOLS_DIR/appimagetool.AppDir/AppRun" || { echo "ERROR: appimagetool missing"; exit 1; }
            test -x "$POM2_APPIMAGE_TOOLS_DIR/linuxdeploy.AppDir/AppRun"  || { echo "ERROR: linuxdeploy missing"; exit 1; }
            echo "int main(){return 0;}" > /tmp/t.cpp
            g++ -std=c++17 /tmp/t.cpp -o /tmp/t && /tmp/t
            echo "OK: toolchain usable"
          '

      - name: Push and report the digest to pin
        run: |
          set -euo pipefail
          docker push "$IMAGE:bionic"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:bionic")
          echo "::notice title=Pin this digest in release.yml::$DIGEST"
          {
            echo "### Builder image published"
            echo ""
            echo 'Pin this in the `linux` job of `release.yml`:'
            echo ""
            echo '```yaml'
            echo "      BUILDER_IMAGE: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
